name: Bisect deploy
on:
  workflow_dispatch:
    inputs:
      commitish:
        description: 'commit to deploy'
        required: true
        default: '149bdaf'
jobs:
  bisect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commitish }}
      - name: Install wrangler
        run: npm i wrangler@4
      - name: Deploy as bisect-gw
        run: sed -i 's/name = "v2ray"/name = "bisect-gw"/' wrangler.toml && npx wrangler deploy
