name: Half real-code bisect
on:
  workflow_dispatch:
    inputs:
      lines:
        required: true
        default: '555'
jobs:
  half:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@4
      - name: Build truncated
        run: python3 scripts/half_build.py ${{ inputs.lines }}
      - name: Deploy
        run: npx wrangler deploy -c /tmp/half.toml
