name: Half deploy
on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'keep first N lines'
        required: true
        default: '300'
jobs:
  half:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@4
      - name: Deploy truncated
        run: |
          node -e "const fs=require('fs');const lines=fs.readFileSync('src/index.js','utf8').split('\n');const n=parseInt(process.argv[1]);fs.writeFileSync('/tmp/halfmain.js','export default { fetch() { return new Response(\"half-ok lines='+n+'\"); } };');" ${{ inputs.lines }}
          sed 's/name = "v2ray"/name = "half-gw"/; s|main = "src/index.js"|main = "/tmp/halfmain.js"|' wrangler.toml > /tmp/half.toml
          npx wrangler deploy -c /tmp/half.toml
