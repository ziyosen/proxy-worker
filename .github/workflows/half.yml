name: Half deploy
on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'keep first N lines of index.js'
        required: true
        default: '300'
jobs:
  half:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@4
      - name: Deploy truncated gateway
        run: |
          head -n ${{ inputs.lines }} src/index.js > /tmp/halfbody.js
          echo 'export default { fetch() { return new Response("half-ok lines="+'$(wc -l < /tmp/halfbody.js)+'"); } };' > /tmp/halfmain.js
          sed 's/name = "v2ray"/name = "half-gw"/; s|main = "src/index.js"|main = "/tmp/halfmain.js"|' wrangler.toml > /tmp/half.toml
          npx wrangler deploy -c /tmp/half.toml
