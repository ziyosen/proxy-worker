name: Versions list via wrangler
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - run: npm i wrangler@4
      - run: npx wrangler versions list --name v2ray 2>&1 | head -60
