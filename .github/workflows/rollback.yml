name: Rollback worker
on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        default: 'v2ray'
jobs:
  rb:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@4
      - name: Rollback
        run: npx wrangler rollback ${{ inputs.name }} --message "rollback to healthy version"
