name: Fix v2ray route
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@3.90.0
      - name: Deploy with workers_dev=false
        run: sed -i 's/workers_dev = true/workers_dev = false/' wrangler.toml && npx wrangler deploy
      - name: Deploy with workers_dev=true
        run: sed -i 's/workers_dev = false/workers_dev = true/' wrangler.toml && npx wrangler deploy
