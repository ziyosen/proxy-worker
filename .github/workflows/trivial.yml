name: Deploy trivial test worker
on:
  workflow_dispatch:
jobs:
  trivial:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@3.90.0
      - name: Deploy trivial
        run: |
          mkdir -p /tmp/triv
          echo 'export default { fetch() { return new Response("triv-ok"); } };' > /tmp/triv/index.js
          npx wrangler deploy --name gw-triv /tmp/triv/index.js --compatibility-date 2024-09-23
