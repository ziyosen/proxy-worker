name: Deploy gw2 with wrangler 4
on:
  workflow_dispatch:
jobs:
  w4:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler 4
        run: npm i wrangler@4
      - name: Deploy gateway as gw2
        run: sed -i 's/name = "v2ray"/name = "gw2"/' wrangler.toml && npx wrangler deploy
