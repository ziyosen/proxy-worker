name: Trivial with bindings
on:
  workflow_dispatch:
jobs:
  t2:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@4
      - name: Deploy trivial with bindings
        run: |
          cat > /tmp/triv2.toml <<'TOML'
          name = "gw-triv2"
          main = "/tmp/triv2.js"
          compatibility_date = "2024-09-23"
          account_id = "ea1aab81dc8e22018131832d124a54fc"
          workers_dev = true

          [[kv_namespaces]]
          binding = "YUMI"
          id = "8ff1913fa986482d967e0a5c7e2b0791"

          [vars]
          UUIDS = "2bcfbfba-b446-4ad5-93ad-72af9e008f61"
          TOML
          echo 'export default { fetch() { return new Response("triv2-ok"); } };' > /tmp/triv2.js
          npx wrangler deploy -c /tmp/triv2.toml
