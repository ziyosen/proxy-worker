name: Trivial redeploy test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - run: npm i wrangler@4
      - run: |
          echo 'export default { fetch() { return new Response("triv3-ok"); } };' > /tmp/t3.js
          npx wrangler deploy --name gw-triv /tmp/t3.js --compatibility-date 2024-09-23
          echo "--- now half-gw stub ---"
          python3 scripts/half_build.py stub || true
          npx wrangler deploy -c /tmp/half.toml
