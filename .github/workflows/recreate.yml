name: Recreate v2ray worker
on:
  workflow_dispatch:
jobs:
  recreate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea1aab81dc8e22018131832d124a54fc
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i wrangler@3.90.0
      - name: Deploy worker
        run: npx wrangler deploy
